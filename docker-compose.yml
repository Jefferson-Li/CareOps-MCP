services:
  careos:
    build:
      context: .
      dockerfile: Dockerfile.node
    image: careops-careos:local
    environment:
      CAREOS_HOST: "0.0.0.0"
      CAREOS_PORT: "3847"
      CAREOS_SEED_ON_START: "1"
      NODE_ENV: development
      OCR_URL: http://ocr:3850
    ports:
      - "${CAREOS_HOST_PORT:-3847}:3847"
    volumes:
      - careos-data:/app/data
      - ./samples:/app/samples:ro
      - ./web:/app/web:ro
    depends_on:
      - ocr
    networks:
      - careops
    restart: unless-stopped

  ocr:
    build:
      context: .
      dockerfile: Dockerfile.ocr
    image: careops-ocr:local
    environment:
      OCR_HOST: "0.0.0.0"
      OCR_PORT: "3850"
      OCR_MODE: auto
      OCR_ADMIN_ENABLED: "1"
      OCR_RESTRICT_PATH: "0"
    ports:
      - "${OCR_HOST_PORT:-3850}:3850"
    volumes:
      - ./samples:/app/samples
    networks:
      - careops
    restart: unless-stopped

  # Optional: run MCP stdio inside the compose network (for demos / CI).
  # Cursor usually runs MCP on the host against published CareOS/OCR ports.
  mcp:
    profiles: ["mcp"]
    image: careops-careos:local
    depends_on:
      careos:
        condition: service_healthy
      ocr:
        condition: service_healthy
    environment:
      CAREOS_URL: http://careos:3847
      OCR_URL: http://ocr:3850
      MCP_ACTOR: docker
      CAREOPS_MCP_TOKEN: ${CAREOPS_MCP_TOKEN:-}
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-}
    volumes:
      - careos-data:/app/data
      - ./samples:/app/samples:ro
    networks:
      - careops
    entrypoint: ["npx", "tsx", "src/mcp/index.ts"]
    stdin_open: true
    tty: true

volumes:
  careos-data:

networks:
  careops:
    driver: bridge
