name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# contents stays read-only. actions: write is required to upload artifacts
# once the default token permissions are overridden.
permissions:
  contents: read
  actions: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run unit tests
        run: make test

      # coverage/ is produced on the host only when the test image publishes it.
      # The HTML report change may not be on main yet, so a missing directory is fine.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14
